<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Bookend Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-screen">
    <section class="form-panel">
      <div class="login-card">
        <a class="brand form-brand" href="{{ url_for('auth.login') }}" aria-label="Bookend Library">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span>bookend<span class="brand-period">.</span></span>
        </a>
        <p class="eyebrow form-eyebrow">JOIN BOOKEND</p>
        <h1>Create your account</h1>
        {% if error_message %}
        <p class="preview-message" role="alert">{{ error_message }}</p>
        {% endif %}
        <form class="login-form" method="post">
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
          </div>
          <div class="form-field">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
          </div>
          <div class="form-field">
            <label for="role">Account type</label>
            <select id="role" name="role" required>
              <option value="patron">Patron</option>
              <option value="librarian">Librarian</option>
            </select>
          </div>
          <div class="form-field">
            <label for="staff_code">Librarian staff code</label>
            <input id="staff_code" name="staff_code" type="password" autocomplete="off">
          </div>
          <button class="submit-button" type="submit">
            <span>Create account</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </form>
        <p><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
      </div>
    </section>
  </main>
</body>
</html>
