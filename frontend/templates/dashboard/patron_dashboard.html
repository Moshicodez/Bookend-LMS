<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patron dashboard | Bookend Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>Welcome, {{ username }}</h1>
    <p>Your patron account is ready. Browse the catalog to find your next book.</p>
    <p><a href="{{ url_for('books.catalog') }}">Browse the catalog</a></p>
    <p><a href="{{ url_for('loans.index') }}">View your loans and fees</a></p>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <button type="submit">Sign out</button>
    </form>
  </main>
</body>
</html>
