{% extends "base/layout.html" %}
{% block title %}Login — Bookend{% endblock %}

{% block content %}
<div class="form-card">
    <h2><i class="fa fa-sign-in-alt"></i> Login</h2>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Your username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
    <div class="form-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>
</div>
{% endblock %}
