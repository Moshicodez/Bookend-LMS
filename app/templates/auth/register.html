{% extends "base/layout.html" %}
{% block title %}Register — Bookend{% endblock %}

{% block content %}
<div class="form-card">
    <h2><i class="fa fa-user-plus"></i> Create Account</h2>
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Min. 8 characters" id="password">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_pass" required placeholder="Repeat password">
        </div>
        <div class="form-group">
            <label>Staff Code <span style="color:#999; font-weight:normal;">(leave blank if you're a patron)</span></label>
            <input type="password" name="staff_code" placeholder="Librarian staff code">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
    </form>
    <div class="form-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </div>
</div>
{% endblock %}
