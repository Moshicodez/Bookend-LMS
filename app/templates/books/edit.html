{% extends "base/layout.html" %}
{% block title %}Edit Book — Bookend{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 560px;">
    <h2><i class="fa fa-edit"></i> Edit Book</h2>
    <form method="POST">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required value="{{ book.title }}">
        </div>
        <div class="form-group">
            <label>Author</label>
            <input type="text" name="author" required value="{{ book.author }}">
        </div>
        <div class="form-group">
            <label>Genre</label>
            <select name="genre">
                <option value="">— Select Genre —</option>
                {% for g in ['Fiction','Non-Fiction','Textbook','Children','Business','Science'] %}
                    <option {% if book.genre == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description">{{ book.description or '' }}</textarea>
        </div>
        <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
            <a href="{{ url_for('books.index') }}" class="btn btn-secondary" style="flex:1; text-align:center; line-height:2;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
